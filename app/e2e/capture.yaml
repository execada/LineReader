# Экран съёмки: режимы, подсказки, языки и закрытие. Затвор на симуляторе не проверить:
# у симулятора нет камеры.
appId: app.sverka.mvp
---
- launchApp:
    clearState: true
- tapOn: "Снять текст"
- extendedWaitUntil:
    visible: "Без сети, всё на телефоне"
    timeout: 30000
- assertVisible: "Наведите на любой текст: книгу, вывеску, экран"
- tapOn: "КНИГА"
- assertVisible: "Прижмите страницы, чтобы строки не изгибались"
- tapOn: "ДОКУМЕНТ"
- assertVisible: "Сканер найдёт края листа и выровняет его"
- assertVisible: "Готово"
- tapOn: "Закрыть"
- assertVisible: "Мои тексты"
