# Опечатки на самой бумаге: сгенерированная справка с «сентябр», «бухгалтерей» и «Rusia».
# Запуск: MEDIA=eval/camera/images/typos_ru_en_photo.jpg e2e/run-ios.sh <Sverka.app> e2e/typos.yaml
appId: app.sverka.mvp
---
- launchApp:
    clearState: true
- tapOn: "Из фото"
- repeat:
    times: 6
    while:
      notVisible: "Копировать"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "16%,24%"
      - tapOn:
          point: "90%,11%"
- extendedWaitUntil:
    visible: "Опечатки 3"
    timeout: 30000
- tapOn: "Опечатки 3"
# The system's suggestions differ between devices, so the flow does not rely on a particular one.
- tapOn:
    text: "Оставить"
    index: 0
- extendedWaitUntil:
    visible: "Опечатки 2"
    timeout: 15000
- tapOn:
    text: "Заменить на «.*»"
    index: 0
- extendedWaitUntil:
    visible: "Опечатки 1"
    timeout: 15000
